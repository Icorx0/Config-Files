# Catppuccin Mocha (dark) — tmux status line colors
# Palette:
#   base      #1e1e2e
#   surface0  #313244
#   surface1  #45475a
#   text      #cdd6f4
#   subtext1  #bac2de
#   mauve     #cba6f7
#   blue      #89b4fa
#   green     #a6e3a1
#   yellow    #f9e2af
#   red       #f38ba8

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#cba6f7]"
set -g status-right "#[fg=#89b4fa]#[bg=#89b4fa,fg=#1e1e2e,bold] %Y-%m-%d %H:%M "
set -g status-left-length 40
set -g status-right-length 60

set -g window-status-format "#[fg=#bac2de,bg=#1e1e2e] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"

set -g message-style "bg=#cba6f7,fg=#1e1e2e"
set -g message-command-style "bg=#cba6f7,fg=#1e1e2e"

set -g mode-style "bg=#f9e2af,fg=#1e1e2e"
