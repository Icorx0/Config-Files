# Catppuccin Latte (light) — tmux status line colors
# Palette:
#   base      #eff1f5
#   surface0  #ccd0da
#   surface1  #bcc0cc
#   text      #4c4f69
#   subtext1  #5c5f77
#   mauve     #8839ef
#   blue      #1e66f5
#   green     #40a02b
#   yellow    #df8e1d
#   red       #d20f39

set -g status-style "bg=#eff1f5,fg=#4c4f69"
set -g status-left "#[bg=#8839ef,fg=#eff1f5,bold] #S #[bg=#eff1f5,fg=#8839ef]"
set -g status-right "#[fg=#1e66f5]#[bg=#1e66f5,fg=#eff1f5,bold] %Y-%m-%d %H:%M "
set -g status-left-length 40
set -g status-right-length 60

set -g window-status-format "#[fg=#5c5f77,bg=#eff1f5] #I:#W "
set -g window-status-current-format "#[fg=#eff1f5,bg=#1e66f5,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#8839ef"

set -g message-style "bg=#8839ef,fg=#eff1f5"
set -g message-command-style "bg=#8839ef,fg=#eff1f5"

set -g mode-style "bg=#df8e1d,fg=#eff1f5"
