# True colors
#set -g default-terminal "alacritty"
#set-option -sa terminal-overrides ",alacritty*:Tc"
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:Tc"

# Change prefix
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g mouse on

# Session picker (fullscreen, zoomed)
bind s choose-tree -Zs
bind S command-prompt -p "New session name:" "new-session -d -s '%%' && switch-client -t '%%'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-logging'

# Auto-restore session on tmux start
set -g @continuum-restore 'on'

# Save and restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Theme: Catppuccin Latte (light)
# See themes/tmux-mocha.conf for the dark variant.
set -g status-style "bg=#eff1f5,fg=#4c4f69"
set -g status-left "#[bg=#8839ef,fg=#eff1f5,bold] #S #[bg=#eff1f5,fg=#8839ef]"
set -g status-right "#[fg=#1e66f5]#[bg=#1e66f5,fg=#eff1f5,bold] %Y-%m-%d %H:%M "
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-format "#[fg=#5c5f77,bg=#eff1f5] #I:#W "
set -g window-status-current-format "#[fg=#eff1f5,bg=#1e66f5,bold] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#bcc0cc"
set -g pane-active-border-style "fg=#8839ef"
set -g message-style "bg=#8839ef,fg=#eff1f5"
set -g message-command-style "bg=#8839ef,fg=#eff1f5"
set -g mode-style "bg=#df8e1d,fg=#eff1f5"

# Initialize TPM (must be at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
